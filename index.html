// ================================================================
// FIREBASE REST API (вместо SDK — надёжнее, без WebSocket)
// ================================================================
async function fbFetch(url, opts = {}, attempt = 1) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(tid);
    return res;
  } catch(e) {
    clearTimeout(tid);
    if (attempt < 3) {
      await new Promise(r => setTimeout(r, 1500)); // пауза перед повтором
      return fbFetch(url, opts, attempt + 1);
    }
    throw new Error('Нет ответа от Firebase. Проверьте интернет и попробуйте ещё раз.');
  }
}
async function fbGet(path) {
  const res = await fbFetch(`${fbConfig.databaseURL}/${path}.json`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Ошибка чтения (${res.status})`);
  return res.json();
}
async function fbSet(path, value) {
  const res = await fbFetch(`${fbConfig.databaseURL}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value)
  });
  if (!res.ok) throw new Error(`Ошибка записи (${res.status})`);
  return res.json();
}
async function fbRemove(path) {
  const res = await fbFetch(`${fbConfig.databaseURL}/${path}.json`, { method: 'DELETE' });
  if (!res.ok) throw new Error(`Ошибка удаления (${res.status})`);
}

// ================================================================
// IN-MEMORY STATE
// ================================================================
const S = { clients: {}, stages: {}, stagesMeta: null, stagesTeam: {}, stagesMetaTeam: null, feedback: {}, presence: {}, loaded: false };

// ================================================================
// CRYPTO
// ================================================================
async function hashPwd(pwd, salt) {
  // Без salt — старый формат для совместимости с уже сохранёнными паролями в Firebase
  // С salt — новый формат для подписи сессионных токенов
  const input = salt ? (pwd + '_uk_sess_' + salt) : (pwd + '_uk_salt');
  const data = new TextEncoder().encode(input);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPwd(pwd, hash) { return (await hashPwd(pwd)) === hash; }

// Производит подписанный токен сессии, привязанный к хешу пароля.
// Если пароль изменён — старые сессии автоматически инвалидируются.
// Атакующий не может подделать токен без знания актуального хеша пароля из Firebase.
async function makeSessionToken(context, pwdHash) {
  return hashPwd('session_' + context + '_' + pwdHash, 'signing_key_v1');
}

// Экранирование HTML — защита от XSS в именах клиентов и содержимом артефактов
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Безопасное приведение к массиву — Firebase иногда возвращает null или object вместо []
function toArr(v) { if (!v) return []; if (Array.isArray(v)) return v; if (typeof v==='object') return Object.values(v); return []; }

// ================================================================
// DATA LAYER (Firebase REST API — без WebSocket, надёжнее)
// ================================================================
const Data = {

  async load() {
    const [clients, stages, stagesMetaRaw, adminHash, presence, stagesTeamRaw, stagesMetaTeamRaw] = await Promise.all([
      fbGet('clients'),
      fbGet('stages'),
      fbGet('stagesMeta'),
      fbGet('admin/passwordHash'),
      fbGet('presence'),
      fbGet('stages_team'),
      fbGet('stagesMeta_team')
    ]);
    S.presence = presence || {};
    S.clients = clients || {};
    S.stages  = stages  || {};
    S.stagesTeam = stagesTeamRaw || {};

    // Seed stagesMeta (РП) from DEFAULT_STAGES if missing
    if (stagesMetaRaw) {
      S.stagesMeta = stagesMetaRaw;
    } else {
      const seed = {};
      DEFAULT_STAGES.forEach(st => {
        seed[st.id] = { id:st.id, order:st.order, label:st.label, title:st.title, topics:st.topics||[], duration:st.duration||'' };
      });
      await fbSet('stagesMeta', seed);
      S.stagesMeta = seed;
    }

    // Seed stagesMeta_team (Команда) from DEFAULT_STAGES_TEAM if missing
    if (stagesMetaTeamRaw) {
      S.stagesMetaTeam = stagesMetaTeamRaw;
    } else {
      const seed = {};
      DEFAULT_STAGES_TEAM.forEach(st => {
        seed[st.id] = { id:st.id, order:st.order, label:st.label, title:st.title, topics:st.topics||[], duration:st.duration||'' };
      });
      await fbSet('stagesMeta_team', seed);
      S.stagesMetaTeam = seed;
    }

    // Seed missing stage records for РП
    const stagesObj = { ...S.stages };
    let stagesChanged = false;
    Object.values(S.stagesMeta).forEach(st => {
      if (!stagesObj[st.id]) { stagesObj[st.id] = { videoUrl:'', artifacts:[] }; stagesChanged=true; }
    });
    if (stagesChanged) { await fbSet('stages', stagesObj); S.stages = stagesObj; }

    // Seed missing stage records for Команда
    const stagesTeamObj = { ...S.stagesTeam };
    let stagesTeamChanged = false;
    Object.values(S.stagesMetaTeam).forEach(st => {
      if (!stagesTeamObj[st.id]) { stagesTeamObj[st.id] = { videoUrl:'', artifacts:[] }; stagesTeamChanged=true; }
    });
    if (stagesTeamChanged) { await fbSet('stages_team', stagesTeamObj); S.stagesTeam = stagesTeamObj; }

    // Seed admin password on first run
    if (!adminHash) await fbSet('admin/passwordHash', await hashPwd('admin123'));

    S.loaded = true;
  },

  // Обновить клиентов из базы (для polling)
  async refreshClients() {
    const data = (await fbGet('clients')) || {};
    // Нормализуем массивы — Firebase может вернуть null вместо [] или object вместо array
    Object.values(data).forEach(c => {
      c.unlockedStages  = toArr(c.unlockedStages);
      c.completedStages = toArr(c.completedStages);
    });
    S.clients = data;
  },

  // ---- Track helpers ----
  // track = 'rp' | 'team'
  stagesMetaFor(track) {
    if (track === 'team') {
      const src = S.stagesMetaTeam ? Object.values(S.stagesMetaTeam) : DEFAULT_STAGES_TEAM;
      return [...src].sort((a,b)=>a.order-b.order);
    }
    const src = S.stagesMeta ? Object.values(S.stagesMeta) : DEFAULT_STAGES;
    return [...src].sort((a,b)=>a.order-b.order);
  },
  stageMetaFor(id, track) {
    if (track === 'team') return S.stagesMetaTeam ? (S.stagesMetaTeam[id]||null) : DEFAULT_STAGES_TEAM.find(s=>s.id===id);
    return S.stagesMeta ? (S.stagesMeta[id]||null) : DEFAULT_STAGES.find(s=>s.id===id);
  },
  stageDataFor(id, track) {
    if (track === 'team') return S.stagesTeam[id] || { videoUrl:'', artifacts:[] };
    return S.stages[id] || { videoUrl:'', artifacts:[] };
  },
  stageFor(id, track) {
    const m = this.stageMetaFor(id, track);
    return m ? { ...m, ...this.stageDataFor(m.id, track) } : null;
  },
  stagesFor(track) {
    return this.stagesMetaFor(track).map(m=>({...m,...this.stageDataFor(m.id, track)}));
  },
  trackOf(clientId) { return (clientId && S.clients[clientId]?.track) || 'rp'; },

  // ---- Legacy helpers (RP-only, kept for backward compat) ----
  stagesMeta() {
    const src = S.stagesMeta ? Object.values(S.stagesMeta) : DEFAULT_STAGES;
    return [...src].sort((a,b)=>a.order-b.order);
  },
  stageMeta(id) {
    return S.stagesMeta ? (S.stagesMeta[id]||null) : DEFAULT_STAGES.find(s=>s.id===id);
  },
  stageData(id) { return S.stages[id] || { videoUrl:'', artifacts:[] }; },
  stage(id) { const m=this.stageMeta(id); return m ? { ...m, ...this.stageData(m.id) } : null; },
  stages() { return this.stagesMeta().map(m=>({...m,...this.stageData(m.id)})); },

  clients() { return Object.values(S.clients); },
  client(id) { return S.clients[id] || null; },
  clientByLogin(login) { return Object.values(S.clients).find(c=>c.login?.toLowerCase()===login?.toLowerCase())||null; },

  async updateStageData(id, updates, track='rp') {
    const dataPath = track === 'team' ? 'stages_team' : 'stages';
    const store = track === 'team' ? S.stagesTeam : S.stages;
    const merged = { ...(store[id]||{}), ...updates };
    store[id] = merged;
    await fbSet(`${dataPath}/${id}`, merged);
  },

  async updateStageMeta(id, updates, track='rp') {
    const metaPath = track === 'team' ? 'stagesMeta_team' : 'stagesMeta';
    const store = track === 'team' ? S.stagesMetaTeam : S.stagesMeta;
    if (!store) { if (track==='team') S.stagesMetaTeam={}; else S.stagesMeta={}; }
    const src = track === 'team' ? S.stagesMetaTeam : S.stagesMeta;
    src[id] = { ...(src[id]||{}), ...updates };
    await fbSet(`${metaPath}/${id}`, src[id]);
  },

  async addStage(title, label, track='rp') {
    const existingOrders = this.stagesMetaFor(track).map(s=>s.order);
    const order = existingOrders.length ? Math.max(...existingOrders) + 1 : 1;
    const id = 'custom_' + Date.now();
    const meta = { id, order, label, title, topics:[], duration:'' };
    const metaPath = track === 'team' ? 'stagesMeta_team' : 'stagesMeta';
    const dataPath = track === 'team' ? 'stages_team' : 'stages';
    if (track === 'team') {
      if (!S.stagesMetaTeam) S.stagesMetaTeam = {};
      S.stagesMetaTeam[id] = meta;
      S.stagesTeam[id] = { videoUrl:'', artifacts:[] };
    } else {
      if (!S.stagesMeta) S.stagesMeta = {};
      S.stagesMeta[id] = meta;
      S.stages[id] = { videoUrl:'', artifacts:[] };
    }
    await fbSet(`${metaPath}/${id}`, meta);
    await fbSet(`${dataPath}/${id}`, { videoUrl:'', artifacts:[] });
    return id;
  },

  async deleteStage(id, track='rp') {
    const metaPath = track === 'team' ? 'stagesMeta_team' : 'stagesMeta';
    const dataPath = track === 'team' ? 'stages_team' : 'stages';
    if (track === 'team') {
      if (S.stagesMetaTeam) delete S.stagesMetaTeam[id];
      if (S.stagesTeam) delete S.stagesTeam[id];
    } else {
      if (S.stagesMeta) delete S.stagesMeta[id];
      if (S.stages) delete S.stages[id];
    }
    await fbRemove(`${metaPath}/${id}`);
    await fbRemove(`${dataPath}/${id}`);
  },

  async reorderStages(orderedIds, track='rp') {
    const metaPath = track === 'team' ? 'stagesMeta_team' : 'stagesMeta';
    const src = track === 'team' ? S.stagesMetaTeam : S.stagesMeta;
    if (!src) return;
    orderedIds.forEach((id, idx) => { if (src[id]) src[id].order = idx; });
    await Promise.all(orderedIds.map((id, idx) => fbSet(`${metaPath}/${id}/order`, idx)));
  },

  async submitFeedback(stageId, clientId, clientName, rating, comment) {
    const existing = S.feedback?.[stageId]?.[clientId] || {};
    const entry = { clientId, clientName, rating: rating||0, comment: comment||'', updatedAt: new Date().toISOString(),
      answer: existing.answer||'', answeredAt: existing.answeredAt||'' };
    if (!S.feedback[stageId]) S.feedback[stageId] = {};
    S.feedback[stageId][clientId] = entry;
    await fbSet(`feedback/${stageId}/${clientId}`, entry);
  },

  async answerFeedback(stageId, clientId, answer) {
    if (!S.feedback[stageId]?.[clientId]) return;
    S.feedback[stageId][clientId].answer = answer;
    S.feedback[stageId][clientId].answeredAt = new Date().toISOString();
    await fbSet(`feedback/${stageId}/${clientId}/answer`, answer);
    await fbSet(`feedback/${stageId}/${clientId}/answeredAt`, S.feedback[stageId][clientId].answeredAt);
  },

  async loadStageFeedback(stageId) {
    const data = await fbGet(`feedback/${stageId}`);
    if (!S.feedback) S.feedback = {};
    S.feedback[stageId] = data || {};
    return S.feedback[stageId];
  },

  async loadClientFeedback(stageId, clientId) {
    const data = await fbGet(`feedback/${stageId}/${clientId}`);
    if (!S.feedback[stageId]) S.feedback[stageId] = {};
    S.feedback[stageId][clientId] = data || null;
    return data;
  },

  async addClient(name, company, login, password, track='rp') {
    if (this.clientByLogin(login)) throw new Error('Логин уже занят');
    const firstStageId = this.stagesMetaFor(track)[0]?.id || (track === 'team' ? 'lesson1' : 'intro');
    const client = {
      id: 'c_' + Date.now(), name, company, login, track,
      passwordHash: await hashPwd(password),
      unlockedStages: [firstStageId], completedStages: [],
      createdAt: new Date().toISOString()
    };
    S.clients[client.id] = client;
    await fbSet(`clients/${client.id}`, client);
    return client;
  },

  async updateClientPassword(id, newPwd) {
    const hash = await hashPwd(newPwd);
    if (S.clients[id]) S.clients[id].passwordHash = hash;
    await fbSet(`clients/${id}/passwordHash`, hash);
  },

  async deleteClient(id) {
    delete S.clients[id];
    await fbRemove(`clients/${id}`);
    // Clean up all feedback left by this client across all stages
    if (S.feedback) {
      for (const stageId of Object.keys(S.feedback)) {
        if (S.feedback[stageId]?.[id]) {
          delete S.feedback[stageId][id];
          await fbRemove(`feedback/${stageId}/${id}`);
        }
      }
    } else {
      // Even if not cached locally, clean from Firebase
      const allFeedback = await fbGet('feedback') || {};
      for (const stageId of Object.keys(allFeedback)) {
        if (allFeedback[stageId]?.[id]) await fbRemove(`feedback/${stageId}/${id}`);
      }
    }
  },

  async deleteFeedback(stageId, clientId) {
    if (S.feedback?.[stageId]) delete S.feedback[stageId][clientId];
    await fbRemove(`feedback/${stageId}/${clientId}`);
  },

  async deleteClientAnswer(stageId, clientId) {
    if (S.feedback?.[stageId]?.[clientId]) delete S.feedback[stageId][clientId].answer;
    await fbRemove(`feedback/${stageId}/${clientId}/answer`);
  },

  async unlockStage(clientId, stageId) {
    const c = S.clients[clientId]; if (!c) return;
    c.unlockedStages = toArr(c.unlockedStages);
    if (!c.unlockedStages.includes(stageId)) {
      c.unlockedStages = [...c.unlockedStages, stageId];
      await fbSet(`clients/${clientId}/unlockedStages`, c.unlockedStages);
    }
  },

  async lockStage(clientId, stageId) {
    const c = S.clients[clientId]; if (!c) return;
    c.unlockedStages  = toArr(c.unlockedStages).filter(s=>s!==stageId);
    c.completedStages = toArr(c.completedStages).filter(s=>s!==stageId);
    await fbSet(`clients/${clientId}/unlockedStages`,  c.unlockedStages);
    await fbSet(`clients/${clientId}/completedStages`, c.completedStages);
  },

  async completeStage(clientId, stageId) {
    const c = S.clients[clientId]; if (!c) return;
    c.completedStages = toArr(c.completedStages);
    c.unlockedStages  = toArr(c.unlockedStages);
    if (!c.completedStages.includes(stageId)) c.completedStages = [...c.completedStages, stageId];
    // Авто-разблокировка следующего этапа (с учётом трека)
    const track = this.trackOf(clientId);
    const stages = this.stagesMetaFor(track);
    const cur = stages.findIndex(s=>s.id===stageId);
    if (cur !== -1 && cur < stages.length - 1) {
      const nextId = stages[cur+1].id;
      if (!c.unlockedStages.includes(nextId)) c.unlockedStages = [...c.unlockedStages, nextId];
    }
    await fbSet(`clients/${clientId}/completedStages`, c.completedStages);
    await fbSet(`clients/${clientId}/unlockedStages`,  c.unlockedStages);
  },

  async resetClient(clientId) {
    if (!S.clients[clientId]) return;
    const track = this.trackOf(clientId);
    const firstId = this.stagesMetaFor(track)[0]?.id || (track === 'team' ? 'lesson1' : 'intro');
    S.clients[clientId].completedStages = [];
    S.clients[clientId].unlockedStages  = [firstId];
    await fbSet(`clients/${clientId}/completedStages`, null);
    await fbSet(`clients/${clientId}/unlockedStages`,  [firstId]);
  },

  async unlockAll(clientId) {
    const track = this.trackOf(clientId);
    const all = this.stagesMetaFor(track).map(s=>s.id);
    if (S.clients[clientId]) S.clients[clientId].unlockedStages = all;
    await fbSet(`clients/${clientId}/unlockedStages`, all);
  },

  async getAdminHash() { return fbGet('admin/passwordHash'); },

  // Presence
  async updatePresence(clientId, page) {
    await fbSet(`presence/${clientId}`, { t: Date.now(), page });
  },
  async clearPresence(clientId) {
    await fbRemove(`presence/${clientId}`);
  },
  async refreshPresence() {
    const data = await fbGet('presence') || {};
    S.presence = data;
  },
  isOnline(clientId) {
    const p = S.presence[clientId];
    if (!p || !p.t) return false;
    return (Date.now() - p.t) < 2 * 60 * 1000; // онлайн если активен < 2 минут назад
  },
  async setAdminPassword(pwd) { await fbSet('admin/passwordHash', await hashPwd(pwd)); }
};

// RATE LIMITER — защита от брутфорса
// ================================================================
const RateLimit = {
  _attempts: 0,
  _windowStart: Date.now(),
  MAX: 5,
  WINDOW: 60 * 1000, // 1 минута

  check() {
    const now = Date.now();
    if (now - this._windowStart > this.WINDOW) {
      this._attempts = 0;
      this._windowStart = now;
    }
    if (this._attempts >= this.MAX) {
      const wait = Math.ceil((this.WINDOW - (now - this._windowStart)) / 1000);
      throw new Error(`Слишком много попыток входа. Подождите ${wait} секунд`);
    }
    this._attempts++;
  },

  reset() {
    this._attempts = 0;
    this._windowStart = Date.now();
  }
};

const Auth = {
  session() {
    try {
      const s = JSON.parse(localStorage.getItem(SK.SESSION));
      if (!s) return null;
      // Сессия: 24 часа для Admin, 7 дней для клиента
      if (s.exp && Date.now() > s.exp) { this.clear(); return null; }
      return s;
    } catch { return null; }
  },
  setSession(s, ttl) {
    localStorage.setItem(SK.SESSION, JSON.stringify({ ...s, exp: Date.now() + ttl }));
  },
  clear() { localStorage.removeItem(SK.SESSION); },
  isAdmin() { return !!this.session()?.isAdmin; },

  async loginAdmin(pwd) {
    RateLimit.check();
    const hash = await Data.getAdminHash();
    if (!hash || !(await checkPwd(pwd, hash))) throw new Error('Неверный пароль');
    // Токен сессии привязан к хешу пароля — при смене пароля все сессии инвалидируются
    const sessionToken = await makeSessionToken('admin', hash);
    RateLimit.reset();
    // Admin сессия: 24 часа
    this.setSession({ isAdmin: true, login: ADMIN_LOGIN, _st: sessionToken }, 86400000);
  },

  async loginClient(login, pwd) {
    RateLimit.check();
    const client = Data.clientByLogin(login);
    if (!client) throw new Error('Пользователь не найден');
    if (!(await checkPwd(pwd, client.passwordHash))) throw new Error('Неверный пароль');
    // Токен привязан к хешу пароля клиента
    const sessionToken = await makeSessionToken('client_' + client.id, client.passwordHash);
    RateLimit.reset();
    // Client сессия: 7 дней
    this.setSession({ isAdmin: false, login: client.login, clientId: client.id, _st: sessionToken }, 86400000 * 7);
    return client;
  },

  // Верификация admin сессии против актуального хеша в Firebase
  async verifyAdmin() {
    const sess = this.session();
    if (!sess?.isAdmin || !sess?._st) return false;
    try {
      const hash = await Data.getAdminHash();
      if (!hash) return false;
      const expected = await makeSessionToken('admin', hash);
      return sess._st === expected;
    } catch { return false; }
  },

  // Верификация client сессии против актуального хеша в Firebase
  async verifyClient() {
    const sess = this.session();
    if (sess?.isAdmin || !sess?.clientId || !sess?._st) return false;
    try {
      const client = Data.client(sess.clientId);
      if (!client?.passwordHash) return false;
      const expected = await makeSessionToken('client_' + client.id, client.passwordHash);
      return sess._st === expected;
    } catch { return false; }
  },

  logout() { this.clear(); }
};

function videoEmbed(url) {
  if (!url) return null;
  // YouTube
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  if (yt) return { tp:'iframe', src:`https://www.youtube.com/embed/${yt[1]}?rel=0` };
  // Vimeo
  const vim = url.match(/vimeo\.com\/(\d+)/);
  if (vim) return { tp:'iframe', src:`https://player.vimeo.com/video/${vim[1]}` };
  // Rutube (обычные и приватные: /video/HASH/ или /video/private/HASH/?p=TOKEN)
  const rt = url.match(/rutube\.ru\/video\/(?:private\/)?([a-zA-Z0-9]+)/);
  if (rt) {
    const rtP = url.match(/[?&]p=([^&]+)/);
    return { tp:'iframe', src:`https://rutube.ru/play/embed/${rt[1]}/${rtP ? '?p='+rtP[1] : ''}` };
  }
  if (url.match(/rutube\.ru\/play\/embed\//)) return { tp:'iframe', src:url };
  // Google Drive
  const gd = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (gd) return { tp:'iframe', src:`https://drive.google.com/file/d/${gd[1]}/preview` };
  // Прямой файл
  if (url.match(/\.(mp4|webm|ogg|mov)(\?|$)/i) || url.startsWith('data:video')) return { tp:'video', src:url };
  return { tp:'iframe', src:url };
}

function renderVideo(url) {
  const e = videoEmbed(url);
  if (!e) return `<div class="bg-slate-100 rounded-xl flex items-center justify-center" style="aspect-ratio:16/9">
    <div class="text-center text-slate-400 p-6">
      <svg class="w-14 h-14 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <p class="text-sm">Видео будет добавлено куратором</p>
    </div></div>`;
  if (e.tp==='iframe') return `<div class="vc"><iframe src="${e.src}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>`;
  return `<div class="vc"><video src="${e.src}" controls></video></div>`;
}

let VIEW = 'loading', PARAMS = {};
let ADMIN_TRACK = 'rp'; // 'rp' | 'team'
let realtimeSub = null;
let clientSyncSub = null;

function go(view, params={}) {
  const adminViews = ['adminDashboard','adminClient','adminStage','adminSettings'];
  const clientViews = ['dashboard','stage'];
  if (!adminViews.includes(view)) stopRealtimeSync();
  if (!clientViews.includes(view)) stopClientSync();
  VIEW = view; PARAMS = params;
  render();
  window.scrollTo(0,0);
}

function startRealtimeSync() {
  if (realtimeSub) return;
  // Polling каждые 5 секунд — обновляем DOM только если данные изменились
  realtimeSub = setInterval(async () => {
    if (document.hidden) return;
    if (!['adminDashboard','adminClient'].includes(VIEW)) return;
    try {
      const prevClients = JSON.stringify(S.clients);
      const prevPresence = JSON.stringify(S.presence);
      await Promise.all([Data.refreshClients(), Data.refreshPresence()]);
      const clientsChanged = JSON.stringify(S.clients) !== prevClients;
      const presenceChanged = JSON.stringify(S.presence) !== prevPresence;
      if (!clientsChanged && !presenceChanged) return;
      const app = document.getElementById('app');
      if (!app) return;
      if (VIEW === 'adminDashboard') {
        const modal = document.getElementById('addModal');
        if (modal && !modal.classList.contains('hidden')) return;
        app.innerHTML = vAdminDash(); initAdminForms();
      } else if (VIEW === 'adminClient') { app.innerHTML = vAdminClient(); }
    } catch(e) { /* игнорировать ошибки polling */ }
  }, 5000);
}

function stopRealtimeSync() {
  if (realtimeSub) { clearInterval(realtimeSub); realtimeSub = null; }
}

// Лёгкий polling для клиентов — проверяет раз в 30 сек обновился ли их доступ + heartbeat присутствия
function startClientSync() {
  if (clientSyncSub) return;
  const sess = Auth.session();
  if (!sess || sess.isAdmin) return;
  // Сразу пишем присутствие при входе
  Data.updatePresence(sess.clientId, VIEW).catch(()=>{});
  // При закрытии вкладки — чистим (best effort)
  window.addEventListener('beforeunload', () => {
    Data.clearPresence(sess.clientId).catch(()=>{});
  }, { once: true });
  clientSyncSub = setInterval(async () => {
    const s = Auth.session();
    if (!s || s.isAdmin) return;
    // Heartbeat — пишем только если вкладка активна
    if (!document.hidden && ['dashboard','stage'].includes(VIEW)) {
      Data.updatePresence(s.clientId, VIEW).catch(()=>{});
    }
    if (document.hidden) return;
    if (!['dashboard','stage'].includes(VIEW)) return;
    try {
      const prev = JSON.stringify(S.clients[s.clientId]);
      await Data.refreshClients();
      const next = JSON.stringify(S.clients[s.clientId]);
      if (next === prev) return;
      if (VIEW === 'dashboard') { document.getElementById('app').innerHTML = vClientDash(); }
    } catch(e) {}
  }, 30000);
}

function stopClientSync() {
  if (clientSyncSub) { clearInterval(clientSyncSub); clientSyncSub = null; }
}

// ================================================================
// VIEW — CLIENT DASHBOARD
// ================================================================
function vClientDash() {
  const sess = Auth.session();
  const client = Data.client(sess?.clientId);
  if (!client) { Auth.logout(); go('login'); return ''; }

  const clientTrack = client.track || 'rp';
  const stages = Data.stagesFor(clientTrack);
  const done = (client.completedStages||[]).length, total = stages.length;
  const pct = Math.round(done/total*100);

  const cards = stages.map(stage => {
    const unlocked = (client.unlockedStages||[]).includes(stage.id);
    const completed = (client.completedStages||[]).includes(stage.id);
    const current = unlocked && !completed;
    let bg, icon, badge, badgeTxt;
    if (completed) {
      bg='border-emerald-200 bg-emerald-50 hover:border-emerald-300 cursor-pointer';
      icon=`<div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0 text-emerald-600">${I.check}</div>`;
      badge='bg-emerald-100 text-emerald-700'; badgeTxt='Завершён';
    } else if (current) {
      bg='border-brand-300 bg-white cursor-pointer shadow-sm shadow-brand-100 hover:shadow-md hover:border-brand-400';
      icon=`<div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0 text-brand-600">${I.play}</div>`;
      badge='bg-brand-100 text-brand-700'; badgeTxt='Открыт';
    } else {
      bg='border-slate-200 bg-slate-50/80 opacity-55';
      icon=`<div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center flex-shrink-0 text-slate-400">${I.lock}</div>`;
      badge='bg-slate-100 text-slate-500'; badgeTxt='Заблокирован';
    }
    return `
    <div class="border-2 ${bg} rounded-2xl p-4 transition-all duration-200" ${(unlocked||completed)?`onclick="go('stage',{stageId:'${stage.id}'})"`:''}>
      <div class="flex items-center gap-3">
        ${icon}
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
            <span class="text-[11px] font-bold uppercase tracking-wide ${badge} px-2 py-0.5 rounded-full">${badgeTxt}</span>
            <span class="text-xs text-slate-400">${stage.label}${stage.duration?' · '+stage.duration:''}</span>
          </div>
          <p class="font-semibold text-slate-800 text-sm leading-snug">${esc(stage.title)}</p>
          <p class="text-xs text-slate-400 mt-0.5">${esc(stage.topics?.[0]||'')}</p>
        </div>
        ${(unlocked||completed)?`<span class="text-slate-300 flex-shrink-0">${I.arrow}</span>`:''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="min-h-screen bg-slate-50">
    <div class="bg-white border-b border-slate-100 sticky top-0 z-10">
      <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 bg-brand-100 rounded-xl flex items-center justify-center text-brand-600">${I.book}</div>
          <div>
            <div class="text-sm font-bold text-slate-900">УК «Консилиум»</div>
            <div class="text-xs text-slate-400">${esc(client.name)} · ${clientTrack === 'team' ? 'Участник проекта' : 'Руководитель проектов'}</div>
          </div>
        </div>
        <button onclick="Auth.logout();go('login')" class="flex items-center gap-1 text-xs text-slate-400 hover:text-slate-700 transition font-medium">${I.logout} Выйти</button>
      </div>
    </div>
    <div class="max-w-xl mx-auto px-4 py-5 fi">
      <div class="bg-gradient-to-br from-brand-700 to-brand-600 rounded-2xl p-5 mb-5 text-white">
        <div class="flex items-end justify-between mb-3">
          <div>
            <p class="text-brand-200 text-xs font-medium mb-1">Прогресс обучения</p>
            <p class="text-4xl font-extrabold">${pct}<span class="text-2xl">%</span></p>
          </div>
          <div class="text-right">
            <p class="text-brand-200 text-xs mb-1">Этапов пройдено</p>
            <p class="text-2xl font-bold">${done}<span class="text-brand-300 font-normal text-lg"> / ${total}</span></p>
          </div>
        </div>
        <div class="bg-brand-800/60 rounded-full h-2 overflow-hidden">
          <div class="bg-white rounded-full h-2 transition-all duration-1000" style="width:${pct}%"></div>
        </div>
        ${client.company?`<p class="text-brand-300 text-xs mt-3">${esc(client.company)}</p>`:''}
      </div>
      <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-3">${clientTrack === 'team' ? 'Программа для команды' : 'Программа обучения'}</p>
      <div class="space-y-2.5">${cards}</div>
    </div>
  </div>`;
}

function vStage() {
  const sess = Auth.session();
  const client = Data.client(sess?.clientId);
  const clientTrack = client?.track || 'rp';
  const stage = Data.stageFor(PARAMS.stageId, clientTrack);
  if (!client || !stage) { go('dashboard'); return ''; }
  const unlocked = (client.unlockedStages||[]).includes(stage.id);
  const completed = (client.completedStages||[]).includes(stage.id);
  if (!unlocked && !completed) { go('dashboard'); return ''; }

  const topics = stage.topics.map(t=>`
    <li class="flex items-start gap-2 text-sm text-slate-600">
      <svg class="w-4 h-4 text-brand-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>${t}
    </li>`).join('');

  const arts = (stage.artifacts||[]).map(a => {
    if (a.type==='text') return `
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
        <div class="flex items-center gap-2 text-amber-700 font-semibold text-sm mb-2">${I.txt} ${esc(a.name)}</div>
        <p class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">${esc(a.content)}</p>
      </div>`;
    const href = a.type==='link'?a.url:a.content;
    return `
      <a href="${esc(href)}" target="_blank" rel="noopener"
        class="flex items-center gap-3 bg-white border border-slate-200 hover:border-brand-300 hover:shadow-sm rounded-xl p-4 transition group">
        <div class="w-9 h-9 rounded-lg bg-brand-50 group-hover:bg-brand-100 text-brand-600 flex items-center justify-center flex-shrink-0 transition">${a.type==='link'?I.link:I.file}</div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm text-slate-800 truncate">${esc(a.name)}</p>
          <p class="text-xs text-slate-400">${a.type==='link'?'Открыть ссылку':'Скачать файл'}</p>
        </div>
        <span class="text-slate-300 group-hover:text-brand-400 transition">${I.arrow}</span>
      </a>`;
  }).join('');

  const cta = completed
    ? `<div class="flex items-center justify-center gap-2 w-full bg-emerald-50 border-2 border-emerald-200 text-emerald-700 font-bold py-4 rounded-2xl mt-5 text-sm">${I.check} Этап завершён — отличная работа!</div>`
    : `<button onclick="clientCompleteStage('${stage.id}')"
         class="w-full bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 mt-5 transition text-sm">
         ${I.check} Отметить этап как выполненный
       </button>`;

  return `
  <div class="min-h-screen bg-slate-50">
    <div class="bg-white border-b border-slate-100 sticky top-0 z-10">
      <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center gap-3">
        <button onclick="go('dashboard')" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition">${I.back}</button>
        <div class="min-w-0">
          <p class="text-xs text-slate-400">${stage.label}</p>
          <p class="text-sm font-bold text-slate-900 leading-tight truncate">${stage.title}</p>
        </div>
      </div>
    </div>
    <div class="max-w-xl mx-auto px-4 py-5 fi">
      ${renderVideo(stage.videoUrl)}
      <div class="bg-white rounded-2xl border border-slate-100 p-5 mt-4">
        <p class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-sm">
          <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Темы этапа
        </p>
        <ul class="space-y-2">${topics}</ul>
        ${stage.duration?`<p class="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-100">⏱ Длительность: ${stage.duration}</p>`:''}
      </div>
      ${arts?`<div class="mt-4"><p class="font-bold text-slate-800 mb-3 text-sm">Материалы к этапу</p><div class="space-y-2">${arts}</div></div>`:''}
      ${cta}

      <!-- Feedback block -->
      <div class="mt-4 bg-white rounded-2xl border border-slate-100 p-5" id="feedbackBlock">
        <p class="font-bold text-slate-800 mb-3 text-sm flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Оценка и вопросы
        </p>
        <div class="flex gap-1 mb-4" id="starsRow">
          ${[1,2,3,4,5].map(n=>`<button onclick="setRating(${n})" id="star_${n}" class="text-3xl transition hover:scale-110 select-none" title="${n} звезд">☆</button>`).join('')}
        </div>
        <!-- Hint text -->
        <p class="text-xs text-slate-500 bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 mb-3 leading-relaxed">
          💬 ${esc(stage.questionHint||'Пишите сюда вопросы — мы обсудим их с вами на встрече')}
        </p>
        <!-- Chat thread -->
        <div id="feedbackChat" class="space-y-2 mb-3"></div>
        <!-- Input area -->
        <div id="feedbackInputArea">
          <div class="flex gap-2 items-end">
            <textarea id="feedbackComment" rows="2" placeholder="Ваш вопрос куратору..."
              class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none text-sm resize-none transition"></textarea>
            <button onclick="submitStageFeedback('${stage.id}')"
              class="flex-shrink-0 w-10 h-10 bg-brand-600 hover:bg-brand-700 text-white rounded-xl flex items-center justify-center transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
  // Note: feedback loaded async after render via initStageFeedback()
}

async function loadAdminClientChat(clientId) {
  const el = document.getElementById('clientChatContent');
  if (!el) return;
  const stages = Data.stagesMeta();
  if (!stages.length) { el.innerHTML='<p class="text-slate-400 text-sm text-center py-8">Этапов нет</p>'; return; }
  const results = await Promise.all(stages.map(async s => {
    const fb = await Data.loadClientFeedback(s.id, clientId);
    return { stage: s, fb };
  }));
  const withData = results.filter(r => r.fb?.comment || r.fb?.rating);
  if (!withData.length) {
    el.innerHTML=`<div class="text-center py-16 text-slate-400"><div class="text-5xl mb-4">💬</div><p class="text-sm font-semibold">Вопросов пока нет</p><p class="text-xs mt-1 opacity-60">Клиент ещё не написал вопросов</p></div>`;
    return;
  }
  const stars = n => [1,2,3,4,5].map(i=>i<=n?'⭐':'☆').join('');
  const trashIcon = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
  el.innerHTML = withData.map(({stage, fb}) => `
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-3">
        <span class="h-px bg-slate-200 flex-1"></span>
        <span class="text-xs font-bold uppercase tracking-widest text-slate-400 whitespace-nowrap px-2">${esc(stage.label)}: ${esc(stage.title)}</span>
        <span class="h-px bg-slate-200 flex-1"></span>
      </div>
      <div class="space-y-2">
        ${fb.rating?`<div class="flex justify-end"><span class="text-xs bg-amber-50 border border-amber-200 text-amber-700 px-2.5 py-1 rounded-full">${stars(fb.rating)} ${fb.rating}/5</span></div>`:''}
        ${fb.comment?`
          <div class="flex justify-end items-end gap-2">
            <button onclick="deleteChatMessage('${stage.id}','${clientId}')" title="Удалить сообщение"
              class="w-7 h-7 flex items-center justify-center rounded-xl text-slate-300 hover:text-red-400 hover:bg-red-50 transition flex-shrink-0">${trashIcon}</button>
            <div class="max-w-[80%] bg-brand-600 text-white text-sm px-4 py-2.5 rounded-2xl rounded-br-sm leading-relaxed shadow-sm">
              ${esc(fb.comment)}
              <p class="text-brand-300 text-[10px] mt-1.5">${fb.updatedAt?new Date(fb.updatedAt).toLocaleDateString('ru'):''}</p>
            </div>
          </div>`:''}
        ${fb.answer?`
          <div class="flex justify-start items-end gap-2">
            <div class="max-w-[80%] bg-white border border-slate-200 text-slate-800 text-sm px-4 py-2.5 rounded-2xl rounded-bl-sm leading-relaxed shadow-sm">
              <span class="text-xs font-bold text-brand-600 block mb-1">Ваш ответ</span>
              ${esc(fb.answer)}
            </div>
            <button onclick="deleteChatAnswer('${stage.id}','${clientId}')" title="Удалить ответ"
              class="w-7 h-7 flex items-center justify-center rounded-xl text-slate-300 hover:text-red-400 hover:bg-red-50 transition flex-shrink-0">${trashIcon}</button>
          </div>
          <div class="flex gap-2 mt-2">
            <input type="text" id="chat_ans_${stage.id}" placeholder="Изменить ответ..."
              class="flex-1 text-sm px-3.5 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-300 bg-white">
            <button onclick="sendClientChatAnswer('${stage.id}','${clientId}')"
              class="flex-shrink-0 px-4 py-2.5 bg-slate-600 hover:bg-slate-700 text-white text-sm font-semibold rounded-xl transition">Изменить</button>
          </div>`:fb.comment?`
          <div class="flex gap-2">
            <input type="text" id="chat_ans_${stage.id}" placeholder="Написать ответ клиенту..."
              class="flex-1 text-sm px-3.5 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-300 bg-white">
            <button onclick="sendClientChatAnswer('${stage.id}','${clientId}')"
              class="flex-shrink-0 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition">Отправить</button>
          </div>`:''}
      </div>
    </div>`).join('');
}

async function sendClientChatAnswer(stageId, clientId) {
  const inp = document.getElementById('chat_ans_'+stageId);
  const answer = (inp?.value||'').trim();
  if (!answer) return;
  try {
    await Data.answerFeedback(stageId, clientId, answer);
    toast('Ответ отправлен ✓');
    loadAdminClientChat(clientId);
  } catch(e) { toast('Ошибка: '+e.message,'err'); }
}

async function deleteChatMessage(stageId, clientId) {
  try {
    await Data.deleteFeedback(stageId, clientId);
    toast('Сообщение удалено');
    loadAdminClientChat(clientId);
  } catch(e) { toast('Ошибка: '+e.message,'err'); }
}

async function deleteChatAnswer(stageId, clientId) {
  try {
    await Data.deleteClientAnswer(stageId, clientId);
    toast('Ответ удалён');
    loadAdminClientChat(clientId);
  } catch(e) { toast('Ошибка: '+e.message,'err'); }
}

async function clearClientChat(clientId) {
  if (!confirm('Удалить все вопросы этого клиента из чата? Отменить будет невозможно.')) return;
  try {
    const stages = Data.stagesMeta();
    await Promise.all(stages.map(s => Data.deleteFeedback(s.id, clientId)));
    toast('Чат очищен');
    loadAdminClientChat(clientId);
  } catch(e) { toast('Ошибка: '+e.message,'err'); }
}

async function impersonateClient(clientId) {
  const client = Data.client(clientId);
  if (!client) return toast('Клиент не найден', 'err');
  // Сохраняем сессию администратора
  localStorage.setItem(SK.ADMIN_BACKUP, localStorage.getItem(SK.SESSION));
  // Создаём сессию клиента (с валидным токеном)
  const token = await makeSessionToken('client_' + client.id, client.passwordHash);
  Auth.setSession({ isAdmin: false, login: client.login, clientId: client.id, _st: token, _impersonated: true }, 86400000);
  VIEW = 'dashboard';
  render();
}

function stopImpersonating() {
  const backup = localStorage.getItem(SK.ADMIN_BACKUP);
  if (!backup) return;
  localStorage.setItem(SK.SESSION, backup);
  localStorage.removeItem(SK.ADMIN_BACKUP);
  VIEW = 'adminDashboard';
  render();
}

function renderImpersonationBanner() {
  const sess = Auth.session();
  const backup = localStorage.getItem(SK.ADMIN_BACKUP);
  if (!backup || !sess?._impersonated) return;
  const client = Data.client(sess.clientId);
  const existing = document.getElementById('impersonation-banner');
  if (existing) return; // уже есть
  const banner = document.createElement('div');
  banner.id = 'impersonation-banner';
  banner.className = 'fixed top-0 left-0 right-0 z-50 bg-amber-500 text-white text-sm font-semibold flex items-center justify-center gap-3 px-4 py-2.5 shadow-lg';
  banner.innerHTML = `
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
    <span>Просмотр от лица клиента: <strong>${esc(client?.name || sess.login)}</strong></span>
    <button onclick="stopImpersonating()" class="ml-2 bg-white text-amber-600 hover:bg-amber-50 px-3 py-1 rounded-lg text-xs font-bold transition">← Вернуться в админ</button>
  `;
  document.body.prepend(banner);
  // Сдвигаем контент вниз
  document.getElementById('app').style.paddingTop = '44px';
}

// ================================================================
function render() {
  const app = document.getElementById('app');
  // Убираем баннер при каждом рендере (пересоздаётся ниже если нужен)
  const oldBanner = document.getElementById('impersonation-banner');
  if (oldBanner) oldBanner.remove();
  app.style.paddingTop = '';
  const sess = Auth.session();
  if (!sess) { app.innerHTML = vLogin(); initLoginForm(); return; }
  if (sess.isAdmin) {
    const views = { adminDashboard:vAdminDash, adminClient:vAdminClient, adminStage:vAdminStage, adminSettings:vAdminSettings, adminChats:vAdminChats, adminClientChat:vAdminClientChat };
    app.innerHTML = (views[VIEW]||vAdminDash)();
    startRealtimeSync(); // единая подписка для всех admin-страниц
    if (VIEW==='adminDashboard') initAdminForms();
    if (VIEW==='adminSettings') initSettingsForm();
    if (VIEW==='adminStage') { artType='link'; loadAdminStageFeedback(PARAMS.stageId); }
    if (VIEW==='adminClientChat') loadAdminClientChat(PARAMS.clientId);
  } else {
    const views = { dashboard:vClientDash, stage:vStage };
    app.innerHTML = (views[VIEW]||vClientDash)();
    startClientSync(); // проверяет обновления доступа раз в 30 сек
    if (VIEW==='stage') {
      const sess2 = Auth.session();
      _currentRating = 0;
      if (sess2?.clientId) initStageFeedback(PARAMS.stageId, sess2.clientId);
    }
    renderImpersonationBanner();
  }
}

function initLoginForm() {
  const form = document.getElementById('loginForm');
  if (!form || form._bound) return; // предотвращает множественные обработчики
  form._bound = true;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const login = document.getElementById('li').value.trim();
    const pwd = document.getElementById('pi').value;
    const err = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    err.classList.add('hidden');
    btn.disabled=true; btn.innerHTML=`<span class="sp">↻</span>`;
    try {
      if (login===ADMIN_LOGIN) { await Auth.loginAdmin(pwd); VIEW='adminDashboard'; }
      else { await Auth.loginClient(login, pwd); VIEW='dashboard'; }
      render();
    } catch(ex) {
      const msg = (ex && ex.message && typeof ex.message === 'string') ? ex.message : 'Ошибка входа. Попробуйте ещё раз.';
      err.textContent=msg; err.classList.remove('hidden');
      btn.disabled=false; btn.innerHTML=`Войти <span class="opacity-70">${I.arrow}</span>`;
    }
  });
}

  } else {

    btnRp.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500';
  }
}

async function addArtifact(stageId, track='rp') {
  const name=document.getElementById('artName').value.trim();
  if (!name) { toast('Введите название','err'); return; }
  const stage=Data.stageFor(stageId, track);
  const arts=[...(stage.artifacts||[])];
  if (artType==='link') {
    const url=document.getElementById('artUrl').value.trim();
    if (!url) { toast('Введите ссылку','err'); return; }
    arts.push({ id:'a_'+Date.now(), type:'link', name, url });
  } else if (artType==='file') {
    const file=document.getElementById('artFile').files[0];
    if (!file) { toast('Выберите файл','err'); return; }
    if (file.size>8*1024*1024) { toast('Файл >8 МБ. Используйте ссылку.','err'); return; }
    try {
      const content=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); });
      arts.push({ id:'a_'+Date.now(), type:'file', name, content });
    } catch { toast('Ошибка загрузки','err'); return; }
  } else {
    const content=document.getElementById('artText').value.trim();
    if (!content) { toast('Введите текст','err'); return; }
    arts.push({ id:'a_'+Date.now(), type:'text', name, content });

  toast('Материал добавлен!'); render();
}

function saveConfig() {
  const raw = document.getElementById('fbConfigInput').value.trim();
  const errEl = document.getElementById('configErr');
  errEl.classList.add('hidden');

  let config = null;

  // Method 1: extract key:value pairs directly from text (most robust)
  try {
    const fields = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId','measurementId'];
    const extracted = {};
    fields.forEach(key => {
      const re = new RegExp(key + '["\']?\\s*:\\s*["\']([^"\'\\n]+)["\']');
      const m = raw.match(re);
      if (m) extracted[key] = m[1];
    });
    if (extracted.apiKey && extracted.databaseURL) { config = extracted; }
  } catch(e) {}

  // Method 2: eval the JS object literal
  if (!config) {
    try {
      const match = raw.match(/\{[\s\S]*\}/);
      if (match) {
        // eslint-disable-next-line no-new-func
        config = (new Function('return (' + match[0] + ')'))();
      }
    } catch(e) {}
  }

  // Method 3: try JSON.parse directly
  if (!config) {
    try {
      const match = raw.match(/\{[\s\S]*\}/);
      if (match) config = JSON.parse(match[0]);
    } catch(e) {}
  }

  if (!config) {
    errEl.textContent = 'Не удалось разобрать конфиг. Попробуйте скопировать только значения полей ниже ↓';
    errEl.classList.remove('hidden');
    showManualFields();
    return;
  }

  if (!config.apiKey || !config.databaseURL) {
    errEl.textContent = 'Не найдены apiKey или databaseURL. Убедитесь что создали Realtime Database и скопировали полный конфиг.';
    errEl.classList.remove('hidden');
    showManualFields();
    return;
  }

  if (!initFirebase(config)) {
    errEl.textContent = 'Ошибка подключения к Firebase. Проверьте конфиг.';
    errEl.classList.remove('hidden'); return;
  }

  localStorage.setItem(SK.CONFIG, JSON.stringify(config));
  showDownloadStep(config);
}

    <p class="text-slate-300 text-xs">Может занять до 45 секунд при медленном интернете</p>
  </div>`;

  // Check/init Firebase
  const storedConfig = getStoredConfig();
  if (!storedConfig || !storedConfig.apiKey || !storedConfig.databaseURL) {
    app.innerHTML = vSetup(); return;
  }

  if (!initFirebase(storedConfig)) {
    app.innerHTML = vSetup(); return;
  }

  // Load data
  try {
    await Data.load();
  } catch(e) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl border border-red-200 p-6 max-w-sm text-center">
        <div class="text-4xl mb-3">❌</div>

        </div>
      </div>
    </div>`; return;
  }

  // Route to correct view — с криптографической верификацией сессии
  const sess = Auth.session();
  if (!sess) {
    VIEW = 'login';
  } else if (sess.isAdmin) {
    // КРИТИЧНО: проверяем токен сессии против актуального хеша пароля в Firebase
    // Простая установка isAdmin:true в DevTools не даёт доступ без знания пароля
    const adminValid = await Auth.verifyAdmin();
    if (!adminValid) {
      Auth.logout();
      VIEW = 'login';
      console.warn('[Security] Admin session token invalid — session cleared');
    } else {
      VIEW = 'adminDashboard';
    }
  } else {
    // Верифицируем клиентскую сессию
    const clientValid = await Auth.verifyClient();
    if (!clientValid) {
      Auth.logout();
      VIEW = 'login';
      console.warn('[Security] Client session token invalid — session cleared');
    } else {
      const freshClient = Data.client(sess.clientId);
      if (!freshClient) { Auth.logout(); VIEW = 'login'; }
      else VIEW = 'dashboard';
    }
  }
  render();
}

// ---- Drag & drop stage reorder ----
let _dragSrcId = null;
function stageDragStart(e, id) {
  _dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('opacity-50');
}
function stageDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('border-brand-400','bg-brand-50/30');
}
function stageDragLeave(e) {
  e.currentTarget.classList.remove('border-brand-400','bg-brand-50/30');
}
async function stageDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('border-brand-400','bg-brand-50/30');
  document.querySelectorAll('.stage-card').forEach(c=>c.classList.remove('opacity-50'));
  if (!_dragSrcId || _dragSrcId === targetId) return;
  const ordered = Data.stagesMetaFor(ADMIN_TRACK).map(s=>s.id);
  const srcIdx = ordered.indexOf(_dragSrcId);
  const tgtIdx = ordered.indexOf(targetId);
  ordered.splice(srcIdx, 1);
  ordered.splice(tgtIdx, 0, _dragSrcId);
  try {
    await Data.reorderStages(ordered, ADMIN_TRACK);
    render();
    toast('Порядок сохранён ✓');
  } catch(err) { toast('Ошибка: ' + err.message, 'err'); }
}

  const commentEl = document.getElementById('feedbackComment');
  const comment = (commentEl?.value||'').trim();
  if (!_currentRating && !comment) { toast('Поставьте оценку или напишите вопрос', 'err'); return; }
  // Immediately clear textarea and show bubble (optimistic UI)
  if (commentEl) commentEl.value = '';
  if (comment) {
    const existing = S.feedback?.[stageId]?.[client.id] || {};
    renderFeedbackChat({ ...existing, comment, answer: existing.answer||'' });
  }
  try {
    await Data.submitFeedback(stageId, client.id, client.name, _currentRating, comment || (S.feedback?.[stageId]?.[client.id]?.comment||''));
    if (_currentRating) toast('Оценка сохранена ✓');
    else toast('Вопрос отправлен куратору ✓');
  } catch(e) { toast('Ошибка: ' + e.message, 'err'); }
}

// ---- Admin feedback view ----
async function loadAdminStageFeedback(stageId) {
  const listEl = document.getElementById('adminFeedbackList');
  if (!listEl) return;
  try {
    const fbMap = await Data.loadStageFeedback(stageId);
    const entries = Object.values(fbMap).filter(f=>f.rating||f.comment);
    if (!entries.length) { listEl.innerHTML='<p class="text-xs text-slate-400 text-center py-4">Отзывов пока нет</p>'; return; }
    const stars = n => [1,2,3,4,5].map(i=>i<=n?'⭐':'☆').join('');
    const avgRating = entries.filter(e=>e.rating).reduce((s,e)=>s+e.rating,0) / (entries.filter(e=>e.rating).length||1);
    listEl.innerHTML = `
      <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-3">
        <span class="text-2xl">${stars(Math.round(avgRating))}</span>
        <div>
          <p class="text-sm font-bold text-slate-800">${avgRating.toFixed(1)} / 5</p>
          <p class="text-xs text-slate-500">${entries.filter(e=>e.rating).length} оценок · ${entries.filter(e=>e.comment).length} вопросов</p>
        </div>
      </div>
      ${entries.map(f=>`
      <div class="border border-slate-200 rounded-xl p-4 mb-3" id="fb_${f.clientId}">
        <div class="flex items-start justify-between gap-2 mb-2">
          <div>
            <p class="text-sm font-semibold text-slate-800">${esc(f.clientName||'Клиент')}</p>
            ${f.rating?`<p class="text-xs mt-0.5">${stars(f.rating)}</p>`:''}
          </div>
          <div class="flex items-center gap-2">
            <p class="text-xs text-slate-400">${f.updatedAt?new Date(f.updatedAt).toLocaleDateString('ru'):'—'}</p>
            <button onclick="deleteAdminFeedback('${stageId}','${f.clientId}')" title="Удалить отзыв"
              class="w-6 h-6 flex items-center justify-center rounded-lg text-slate-300 hover:text-red-500 hover:bg-red-50 transition flex-shrink-0">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
        ${f.comment?`<p class="text-sm text-slate-700 bg-slate-50 rounded-lg px-3 py-2 mb-2">${esc(f.comment)}</p>`:''}
        ${f.answer?`
          <div class="bg-brand-50 border border-brand-200 rounded-lg px-3 py-2 mb-2">
            <p class="text-xs font-bold text-brand-700 mb-0.5">Ваш ответ:</p>
            <p class="text-sm text-slate-700">${esc(f.answer)}</p>
          </div>`:
          f.comment?`
          <div class="flex gap-2 mt-2">
            <input type="text" id="ans_${f.clientId}" placeholder="Написать ответ клиенту..."
              class="flex-1 text-sm px-3 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-300">
            <button onclick="sendAdminAnswer('${stageId}','${f.clientId}')"
              class="text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg font-bold transition whitespace-nowrap">Ответить</button>
          </div>`:''}
      </div>`).join('')}`;
  } catch(e) { listEl.innerHTML='<p class="text-xs text-red-400">Ошибка загрузки</p>'; }
}
async function sendAdminAnswer(stageId, clientId) {
  const inp = document.getElementById('ans_'+clientId);
  const answer = (inp?.value||'').trim();
  if (!answer) return;
  try {
    await Data.answerFeedback(stageId, clientId, answer);
    toast('Ответ отправлен клиенту ✓');
    loadAdminStageFeedback(stageId);
  } catch(e) { toast('Ошибка: ' + e.message, 'err'); }
}
async function deleteAdminFeedback(stageId, clientId) {
  // Optimistic: hide card immediately
  const card = document.getElementById('fb_'+clientId);
  if (card) { card.style.opacity='0.4'; card.style.pointerEvents='none'; }
  try {
    await Data.deleteFeedback(stageId, clientId);
    loadAdminStageFeedback(stageId);
    toast('Сообщение удалено');
  } catch(e) {
    if (card) { card.style.opacity=''; card.style.pointerEvents=''; }
    toast('Ошибка: ' + e.message, 'err');
  }
}

let _deletingStageId = null;
let _deletingStageTrack = 'rp';
function openDeleteStage(stageId, track='rp') {
  const s = Data.stageMetaFor(stageId, track);
  if (!s) return;
  _deletingStageId = stageId;
  _deletingStageTrack = track;
  document.getElementById('deleteStageTitle').textContent = `«${s.title}»`;
  document.getElementById('deleteStageModal').classList.remove('hidden');
}
async function confirmDeleteStage() {
  if (!_deletingStageId) return;
  try {
    await Data.deleteStage(_deletingStageId, _deletingStageTrack);
    document.getElementById('deleteStageModal').classList.add('hidden');
    render();
    toast('Этап удалён');
  } catch(e) { toast('Ошибка: ' + e.message, 'err'); }
}

function openAddStage() {
  document.getElementById('newStageTitle').value = '';
  document.getElementById('newStageLabel').value = '';
  document.getElementById('addStageErr').classList.add('hidden');
  document.getElementById('addStageModal').classList.remove('hidden');
}

async function saveAddStage() {
  const title = document.getElementById('newStageTitle').value.trim();
  const label = document.getElementById('newStageLabel').value.trim();
  const err = document.getElementById('addStageErr');
  err.classList.add('hidden');
  if (!title || !label) { err.textContent='Заполните все поля'; err.classList.remove('hidden'); return; }
  try {
    await Data.addStage(title, label, ADMIN_TRACK);
    document.getElementById('addStageModal').classList.add('hidden');
    render();
    toast(ADMIN_TRACK === 'rp' ? 'Этап добавлен ✓' : 'Урок добавлен ✓');
  } catch(e) { err.textContent = e.message; err.classList.remove('hidden'); }
}

boot();
</script>
</body>
